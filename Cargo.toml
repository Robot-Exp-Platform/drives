[workspace]
members = [
    "examples/jaka_dual",
    "examples/jaka_roplat_multilang",
    # "examples/franka_letters",
    "franka-rust",
    "libaubo-rs",
    "libhans-rs",
    "libjaka-rs",
    "libk1",
    "unitree-go2-rs",
    "roplat_exrobot",
    "roplat_rerun",
    "rsbullet/rsbullet",
    "rsbullet/rsbullet-core",
    "utils/rerun_urdf",
]
exclude = [
    "libhans_derive",
    "rsbullet_sys",
    # "./robot_behavior",
    "./robot_behavior_new",
    "utils/topp",
    "utils/copp",
]
resolver = "3"

# The drivers depend on published crates.io versions. At this integration root
# those packages are replaced by the local checkouts: the core and the
# behavior contracts are sibling repositories (../roplat, ../roplat_behavior).
[patch.crates-io]
roplat = { path = "../roplat/roplat" }
roplat_msgs = { path = "../roplat/roplat_msgs" }
roplat_behavior = { path = "../roplat_behavior/roplat_behavior" }
roplat_kinematics = { path = "../roplat_behavior/roplat_kinematics" }
roplat_description = { path = "../roplat_behavior/roplat_description" }
roplat_control = { path = "../roplat_behavior/roplat_control" }
roplat_trajectory = { path = "../roplat_behavior/roplat_trajectory" }
rsbullet = { path = "rsbullet/rsbullet" }
rerun_urdf = { path = "utils/rerun_urdf" }
